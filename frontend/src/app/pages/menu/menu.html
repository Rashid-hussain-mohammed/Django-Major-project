<div class="min-h-screen bg-gray-50 pb-20">
  
  <nav class="bg-white p-4 shadow-sm sticky top-0 z-20">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="text-xl font-black text-gray-900 flex items-center gap-2">
        <span>🍽️</span> Smart Menu
      </div>
      
      <button routerLink="/cart" class="text-sm bg-gray-900 text-white px-4 py-2 rounded-lg font-bold hover:bg-gray-800 transition-colors flex items-center gap-2">
        View Cart 
        @if (cartService.totalItems() > 0) {
          <span class="bg-emerald-500 text-white px-2 py-0.5 rounded-full text-xs">
            {{ cartService.totalItems() }}
          </span>
        }
      </button>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto px-4 mt-8">
    
    <div class="bg-white border border-gray-200 rounded-3xl p-4 md:p-6 mb-8 shadow-sm">
      <div class="relative">
        <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-xl">🔍</span>
        <input [(ngModel)]="searchQuery" 
               type="text" 
               placeholder="Search for burgers, pizza, drinks..." 
               class="w-full pl-12 pr-6 py-4 rounded-2xl border-2 border-gray-100 focus:border-emerald-500 outline-none text-lg transition-colors">
      </div>
    </div>

    <h3 class="text-xl font-black text-gray-900 mb-6 ml-2">Our Menu</h3>
    
    @if (isLoading) {
      <div class="flex justify-center py-20">
        <div class="animate-pulse text-gray-400 font-bold text-xl">Loading Menu...</div>
      </div>
    } @else {
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        @for (dish of filteredDishes; track dish.id) {
          <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-2">
                <h4 class="text-xl font-black text-gray-900">{{ dish.name }}</h4>
                <span class="bg-emerald-50 text-emerald-700 font-black px-3 py-1 rounded-xl">€{{ dish.price }}</span>
              </div>
              <p class="text-gray-500 text-sm leading-relaxed mb-4">{{ dish.description }}</p>
            </div>
            
            <button (click)="addToCart(dish)" 
                    class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl hover:bg-gray-800 transition-colors active:scale-95">
              Add to Cart 🛒
            </button>
          </div>
        } @empty {
          <div class="col-span-full text-center py-12 text-gray-500 font-bold bg-white rounded-3xl border border-gray-100">
            No dishes found matching "{{ searchQuery }}".
          </div>
        }
      </div>
    }
  </div>
</div>
