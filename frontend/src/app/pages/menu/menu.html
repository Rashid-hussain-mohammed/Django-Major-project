<div class="max-w-4xl mx-auto p-4 mt-6">
  <h2 class="text-3xl font-extrabold text-center text-gray-900 mb-8">Digital Menu</h2>
  
  <div class="max-w-2xl mx-auto mb-10 px-4 mt-6">
    <div class="relative group">
      <div class="absolute -inset-1 bg-gradient-to-r from-emerald-600 to-teal-400 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
      
      <div class="relative flex items-center bg-white rounded-2xl p-2 shadow-sm border border-gray-100">
        
        <input 
          #aiInput
          (keyup.enter)="submitAiCommand(aiInput)"
          [disabled]="isAiLoading"
          type="text" 
          placeholder="Type a sentence like: 'I am hungry, I need 2 burgers and a pizza'" 
          class="w-full py-4 px-4 text-gray-700 bg-transparent outline-none disabled:opacity-50"
        >
        
        <button 
          (click)="submitAiCommand(aiInput)"
          [disabled]="isAiLoading"
          class="bg-black text-white font-bold py-3 px-6 rounded-xl hover:bg-gray-800 transition-colors whitespace-nowrap disabled:bg-gray-400">
          {{ isAiLoading ? 'Thinking...' : 'Order by chat' }}
        </button>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    
    @for (dish of dishes; track dish.id) {
      <div class="bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden hover:shadow-lg transition-shadow duration-300 flex flex-col">
        <div class="p-5 flex-grow flex flex-col">
          <h5 class="text-xl font-bold text-gray-800 mb-2">{{ dish.name }}</h5>
          <p class="text-gray-500 text-sm mb-4 line-clamp-3 flex-grow">{{ dish.description }}</p>
          
          <div class="flex items-center justify-between mt-4 pt-4 border-t border-gray-50 h-14">
            <span class="text-lg font-black text-emerald-600">€{{ dish.price }}</span>
            
            @if (getItemQuantity(dish.id) > 0) {
              <div class="flex items-center space-x-2 bg-gray-100 rounded-lg p-1">
                <button 
                  (click)="removeFromCart(dish)" 
                  class="w-8 h-8 rounded bg-white shadow-sm flex items-center justify-center text-gray-700 font-bold hover:text-red-500 transition-colors">
                  -
                </button>
                <span class="font-bold w-6 text-center text-gray-800">
                  {{ getItemQuantity(dish.id) }}
                </span>
                <button 
                  (click)="addToCart(dish)" 
                  class="w-8 h-8 rounded bg-white shadow-sm flex items-center justify-center text-gray-700 font-bold hover:text-emerald-600 transition-colors">
                  +
                </button>
              </div>
            } @else {
              <button 
                  (click)="addToCart(dish)" 
                  class="bg-black text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-800 transition-colors">
              Add to Cart
              </button>
            }
          </div>
          </div>
      </div>
    } @empty {
      <div class="col-span-full text-center text-gray-500 py-10">
        <p class="text-lg">Loading menu from the kitchen...</p>
      </div>
    }

  </div>
</div>
